<!doctype html>
<html>
  <head>
    <title>Apply - Machine Learning Engineer - Proseware</title>
  </head>
  <body>
    <h1>Apply for Machine Learning Engineer</h1>
    <form id="app" action="/submit" method="post">
      <input type="hidden" name="token" value="abc" />

      <label for="first_name">First Name *</label>
      <input id="first_name" name="job_application[first_name]" type="text" required />

      <label>Last Name <input name="job_application[last_name]" type="text" required /></label>

      <input type="email" name="email" aria-label="Email address" required />

      <div>
        <span>Phone</span>
        <input type="tel" name="phone" autocomplete="tel" placeholder="+1 555 0100" />
      </div>

      <label for="li">LinkedIn Profile</label>
      <input id="li" name="urls[LinkedIn]" type="url" />

      <label for="site">Website</label>
      <input id="site" name="urls[Portfolio]" type="url" />

      <label for="resume">Resume/CV</label>
      <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" />

      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Select...</option>
        <option value="US">United States</option>
        <option value="DE">Germany</option>
        <option value="IN">India</option>
      </select>

      <fieldset>
        <legend>Are you legally authorized to work in Germany?</legend>
        <label><input type="radio" name="auth" value="1" /> Yes</label>
        <label><input type="radio" name="auth" value="0" /> No</label>
      </fieldset>

      <label for="sponsor">Will you now or in the future require visa sponsorship?</label>
      <select id="sponsor" name="sponsor">
        <option value="">--</option>
        <option value="y">Yes</option>
        <option value="n">No</option>
      </select>

      <label for="why">Why do you want to work at Proseware?</label>
      <textarea id="why" name="why"></textarea>

      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">Select...</option>
        <option value="f">Female</option>
        <option value="m">Male</option>
        <option value="x">Decline to self-identify</option>
      </select>

      <input type="text" name="trap" style="display: none" aria-label="Leave empty" />

      <button type="submit">Submit application</button>
    </form>
    <script>
      document.getElementById('app').addEventListener('submit', (e) => {
        e.preventDefault();
        window.__submitted = true;
      });
    </script>
  </body>
</html>
